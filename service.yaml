
apiVersion: v1
kind: Service
metadata:
  name: food-frontend
spec:
  type: NodePort
  selector:
    app: food-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: food-backend
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  type: ClusterIP
  selector:
    app: food-mongo
  ports:
    - port: 27017
      targetPort: 27017
